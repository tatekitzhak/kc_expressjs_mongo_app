name: Push to Docker Hub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  call_time:
    uses: ./.github/workflows/shared_time_utility.yml  

  build_and_push_to_docker_image:
    needs: call_time
    name: Push Docker image to Docker Hub
    env:
        GLOBAL_TIME: ${{ needs.call_time.outputs.formatted_time }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Use Shared Time
        run: |
          echo "The time passed from the utility is: $GLOBAL_TIME"

      - name: Log in to Docker Hub 
        uses: docker/login-action@v4
        with: 
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.BACKEND_REST_API_DOCKER_HUB_REPO_NAME }}

      - name: Build Docker Info ${{steps.meta.outputs.tags}}
        run: echo "Build Docker- ${{toJSON(steps.meta)}}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.prod.nodejs
          push: true
          tags: ${{steps.meta.outputs.tags}}
          labels: ${{steps.meta.outputs.labels}}